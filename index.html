<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#2a2238}
@media (max-width:480px){html,body{background:#bfeccd}}   /* v2.2b：スマホでは、セーフエリア（時計・ノッチ・ホームバーの所）もミントにそろえる。パソコンの外まわりは今までどおり */
body{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;color:#2e2438;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;display:none;flex-direction:column}
.screen.on{display:flex}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font-family:inherit;cursor:pointer}
.ov{position:absolute;inset:0;display:none;z-index:20;background:rgba(30,20,45,.55);overflow-y:auto;padding:20px 16px}
.ov.on{display:flex;align-items:center;justify-content:center}
.savefail{position:absolute;left:8px;right:8px;top:8px;max-height:45%;overflow-y:auto;z-index:25;display:none;background:#fff3f3;border:3px solid #c0304a;color:#7a1830;font-size:13px;font-weight:700;padding:8px 10px;border-radius:10px;box-shadow:3px 3px 0 rgba(58,47,69,.35);line-height:1.5}
.savefail.on{display:block}
.rotnote{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#2e2438;color:#fff;text-align:center;padding:20px;font-size:16px;font-weight:700;line-height:1.6}
.rotnote b{font-size:22px}
@media (orientation:landscape) and (max-height:540px) and (hover:none){.rotnote{display:flex}}
.savefail button{margin-top:6px;font:inherit;font-size:13px;padding:5px 10px;border:2px solid #3a2f45;border-radius:8px;background:#ffd84d;color:#2e2438}
#klock{z-index:40}
.rcv{border:2px solid #3a2f45;border-radius:10px;padding:8px;margin:8px 0;text-align:left;font-size:13px;background:#fbf8ff}
.toast{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 16px);top:12px;background:#3a2f45;color:#fff;font-size:14px;padding:7px 14px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:30;white-space:nowrap}
.toast.on{opacity:1}
.fx{position:absolute;font-size:24px;pointer-events:none;animation:float 1.3s steps(8,end) forwards;z-index:6}
/* v2.4：12×12のドット絵を整数倍（2倍・3倍）で表示し、拡大・縮小せず、ドット単位（8段）で上がる。最後は点滅させずに消える */
@keyframes float{0%{opacity:1;transform:translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateY(-64px)}}
@keyframes float3{0%{opacity:1;transform:translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateY(-72px)}}
@keyframes fxrm{0%{opacity:1}100%{opacity:0}}
#kzz.up{transform:translateY(-6px)}

/* ===== こども ===== */
#kid{background:#bfeccd}
.khead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-size:13px}
.khead b{font-size:18px;font-family:'DotGothic16',sans-serif;font-weight:400}
#kgenki{font-size:15px;color:#c0306a}
.kstat{display:flex;gap:8px;padding:0 14px;font-size:13px;align-items:center}
.kstat .bar{flex:1;height:10px;background:#fff;border:2px solid #3a2f45}
.kstat .bar i{display:block;height:100%;background:#ff8fb8;transition:width .5s}
.knext{padding:4px 14px 0;font-size:13px;color:#2f5a35}
.kscene{position:relative;margin:6px 12px 0;border:4px solid #3a2f45;box-shadow:4px 4px 0 #3a2f45}
#kcv{width:100%}
#kov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#kdecor span{position:absolute;font-size:16px;transform:translate(-50%,-50%)}
#kzz{position:absolute;left:58%;top:50%;font-size:20px;color:#2e2438;font-weight:900;text-shadow:-2px 0 #fff,2px 0 #fff,0 -2px #fff,0 2px #fff}
#kmsg{margin:10px 12px 0;min-height:2.9em;font-size:15px;background:#fff;border:3px solid #3a2f45;padding:6px 10px;line-height:1.4}
.kbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 12px 0}
.kbtns button{border:3px solid #3a2f45;background:#fff;border-radius:14px;padding:7px 2px;font-size:14px;font-weight:900;color:#2e2438;box-shadow:0 4px 0 #3a2f45;display:flex;flex-direction:column;align-items:center;gap:1px}
.kbtns button em{font-style:normal;font-size:22px;height:30px;display:flex;align-items:center}
.kbtns img.bi{width:30px;height:30px;image-rendering:pixelated}
.kbtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2f45}
#kid .foot{width:auto;margin:10px 12px}
.kbtns2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 12px 0}
.kbtns2 button{border:3px solid #3a2f45;background:#fff;border-radius:12px;padding:6px 2px;font-size:14px;font-weight:900;color:#2e2438;box-shadow:0 3px 0 #3a2f45}
.kbtns2 button:active{transform:translateY(2px);box-shadow:0 1px 0 #3a2f45}
img.apic{width:44px;height:44px;image-rendering:pixelated;flex:none}
img.apicl{width:96px;height:96px;image-rendering:pixelated;display:block;margin:6px auto}
.atbl{width:100%;font-size:14px;text-align:left;border-collapse:collapse;margin-top:6px}.atbl td{padding:3px 4px;border-bottom:1px dashed #cbb}
.atbl td:first-child{white-space:nowrap;width:1%;vertical-align:top}.atbl td+td{overflow-wrap:anywhere;word-break:break-word}   /* 見出しは1行、長い文は右の列の中で折り返す */
.atbl td.dt{white-space:nowrap}@media(max-width:360px){.atbl{font-size:13px}}
.pbtn.red{background:#ffb3b3}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.item{border:3px solid #ddd;background:#fff;padding:6px 2px;font-size:12px;text-align:center;line-height:1.3;color:#2e2438}
.item em{display:block;font-size:24px;font-style:normal}
.item.on{border-color:#ff6f9c;background:#fff0f6}
.item.dis{opacity:.6;background:#eee}
.place{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:3px solid #3a2f45;background:#fff;padding:10px;margin-top:8px;font-size:15px}
.place em{font-style:normal;font-size:26px}
.place small{display:block;font-size:13px;color:#5a4868}
.place:disabled{opacity:.7;background:#eee}
.tabs{display:flex;gap:4px;margin:6px 0}
.tabs button{flex:1;border:3px solid #3a2f45;background:#eee;padding:6px;font-size:13px}
.tabs button.on{background:#ffd84d}
.sel{font-size:22px;min-height:34px;margin:4px 0;text-align:center}
#fcv{width:100%;border:3px solid #3a2f45;margin:6px 0}
.empty{font-size:13px;color:#999;padding:16px 0}
img.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.item em img.pix{width:34px;height:34px}
.got img.pix{width:84px;height:84px}
.mapg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.mt{min-width:0;padding:0;overflow:hidden;aspect-ratio:1;border:3px solid #3a2f45;background:#8fd17a;font-size:26px;border-radius:8px;box-shadow:0 3px 0 #3a2f45;background-image:radial-gradient(#6fb85f 20%,transparent 22%);background-size:10px 10px}
.mt.open{background:#fff8ec}
.mt.got{background:#ffe8a0;opacity:.75}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
.sq{position:relative;aspect-ratio:1;border:3px solid #3a2f45;border-radius:10px;background:#fff8ec;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0;color:#3a2f45}
.sq .ic{filter:none}
.sq.seen{background:#e8e2ee}
.sq.start{background:#d6f0ff}.sq.goal{background:#ffe8a0}.sq.puzzle{background:#f0e4ff}.sq.short{background:#dff7d8}
.sq.tgt{opacity:1;box-shadow:0 0 0 3px #ff5f97;animation:hint .6s ease-in-out infinite}
.sq .no{position:absolute;left:3px;top:1px;font-size:11px;color:#6a5a78}
.sq img.me{width:80%;height:80%}
.mapg.p3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mmsg{font-size:14px;color:#2e2438;min-height:2.4em}
.got{font-size:30px;letter-spacing:4px;margin:8px 0}
.foot{display:flex;justify-content:space-between;gap:6px;width:92%;max-width:360px;margin:12px auto 10px}
.foot button{font-size:13px;border:2px solid #3a2f45;background:#fff;border-radius:99px;padding:6px 12px;color:#2e2438}
.kcard,.acard{background:#fff;border:4px solid #3a2f45;box-shadow:6px 6px 0 #3a2f45;padding:20px;width:100%;max-width:360px;text-align:center}
.kcard h2,.acard h2{font-size:20px;margin-bottom:8px;font-family:'DotGothic16',sans-serif;font-weight:400}
.kcard p,.acard p{font-size:14px;color:#4a3d58;line-height:1.6;margin-bottom:12px}
.kcard input,.acard input{width:100%;font:inherit;font-size:20px;text-align:center;padding:10px;border:3px solid #3a2f45;outline:none}
.pbtn{display:block;width:100%;margin-top:14px;padding:12px;font-size:17px;border:3px solid #3a2f45;background:#ffd84d;box-shadow:0 4px 0 #3a2f45}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2f45}
.pbtn.pink{background:#ff9cc2}
.pbtn.gray{background:#eee}



/* 縦長の画面では、キャラの画面を縦に大きくする */
#kid .kscene{flex:1 1 auto;min-height:0;display:flex}
#kid #kcv{width:100%;height:100%}
#kid .foot{padding-bottom:6px}

button:disabled{color:#2e2438}
.pbtn:disabled{opacity:.55}
img.ii{width:1.3em;height:1.3em;vertical-align:-.28em;image-rendering:pixelated;image-rendering:crisp-edges}
.item em img.ii{width:34px;height:34px}
.sel img.ii{width:34px;height:34px}
.got img.ii{width:44px;height:44px;margin:0 2px}
.place em img.ii{width:30px;height:30px}
.sq .ic{display:flex;width:66%;height:66%;align-items:center;justify-content:center}
.sq .ic img.ii{width:100%;height:100%}
.mt img.ii{width:66%;height:66%}
.fx img{width:24px;height:24px;image-rendering:pixelated}
@media (min-width:360px){.fx{animation-name:float3}.fx img{width:36px;height:36px}}
@media (prefers-reduced-motion:reduce){.fx{animation:fxrm 1.1s steps(1,end) forwards}}
.tleft{text-align:left}
.sbox{border:3px solid #3a2f45;border-radius:12px;padding:8px 10px;margin:10px 0;text-align:left;font-size:14px}
.sbox .pbtn{margin-top:8px}
.codeta{display:block;width:100%;height:72px;margin-top:8px;font:12px/1.3 monospace;border:2px solid #3a2f45;border-radius:8px;padding:6px;word-break:break-all;resize:vertical}
label.fl{display:block;text-align:center;cursor:pointer}
label.fl input{display:none}
.dsc{font-size:12px;margin:6px 0;border:2px dashed #b8a8c8;border-radius:10px;padding:6px 8px}
#kbub.sl,#kbub.sr{transform:translate(0,-50%)}
#kbub.sl:after,#kbub.sr:after,#kbub.sl:before,#kbub.sr:before{left:auto;bottom:auto;top:var(--tailY,50%)}
#kbub.sl:after{right:-11px;margin:-8px 0 0;border:8px solid transparent;border-left:10px solid #3a2f45;border-right:0}
#kbub.sl:before{right:-6px;margin:-5px 0 0;border:5px solid transparent;border-left:7px solid #fff;border-right:0}
#kbub.sr:after{left:-11px;margin:-8px 0 0;border:8px solid transparent;border-right:10px solid #3a2f45;border-left:0}
#kbub.sr:before{left:-6px;margin:-5px 0 0;border:5px solid transparent;border-right:7px solid #fff;border-left:0}
.dsc summary{font-weight:900;cursor:pointer}
.dsc p{font-size:12px!important;line-height:1.6;margin:6px 0 0!important}
#kmodal.on{align-items:flex-start}
#kmodal .kcard{margin:auto}
#kbub{position:absolute;left:50%;top:40%;transform:translate(-50%,-100%);max-width:78%;width:max-content;background:#fff;border:3px solid #3a2f45;border-radius:14px;
  padding:5px 10px;font-size:15px;font-weight:900;line-height:1.35;color:#2e2438;box-shadow:2px 3px 0 rgba(58,47,69,.35);opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;text-align:center}
#kbub.on{opacity:1}
#kbub .ln{display:block;white-space:nowrap}   /* 改行は bubLayout が決める（ブラウザに1文字ずつ折り返させない） */
#kbub:after{content:"";position:absolute;left:var(--tail,50%);bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top:10px solid #3a2f45;border-bottom:0}
#kbub:before{content:"";position:absolute;left:var(--tail,50%);bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top:7px solid #fff;border-bottom:0;z-index:1}
.talk{display:flex;align-items:center;gap:8px;margin:6px 0 4px;text-align:left}
.talk img.face{width:46px;height:46px;flex:none;image-rendering:pixelated;background:#e8f6ee;border:3px solid #3a2f45;border-radius:10px;padding:2px}
.talk .tb{position:relative;flex:1;background:#fff;border:3px solid #3a2f45;border-radius:12px;padding:6px 10px;font-size:15px;font-weight:900;color:#2e2438;min-height:2.2em;display:flex;align-items:center}
.talk .tb:before{content:"";position:absolute;left:-11px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:10px solid #3a2f45;border-left:0}
.hint{animation:hint 1s ease-in-out infinite;border-color:#ff5f97!important;background:#fff0f6!important}
@keyframes hint{50%{transform:translateY(-4px)}}
.zk .fd{font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;font-weight:400}   /* v2.1：プロフィール帳・ことば図鑑・進化図鑑だけ。タイトル・タブ・項目名・No.・発見数 */
.zk .fm,.zk small,.zk .place small,.zk p{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif}   /* 説明・セリフ・日付・メモ */
.zk .place>span{font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;font-weight:400;font-size:16px;min-width:0;overflow-wrap:anywhere}
.zk .place>span small{font-weight:700}
.zk .ztabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.zk .ztab{flex:1 1 calc(25% - 4px);min-width:0;min-height:40px;padding:4px 0;white-space:nowrap;font-size:16px;line-height:1.1;border:3px solid #3a2f45;background:#fff;color:#2e2438}
.zk .ztab small{display:block;font-size:13px}
.zk .ztab.on{background:#ffd84d}
.zk .ptbl td.fd,.zk p.fd{font-size:16px}
.zk .wrow{display:flex;gap:8px;align-items:baseline;text-align:left;padding:6px 2px;border-bottom:1px dashed #cbb;min-width:0}
.zk .wno{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.zk .wt{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere;word-break:break-word}
.zk .wt small{display:block;font-size:13px;color:#5a4868;font-weight:500}
.zk .wq{font-size:16px;color:#9a8aa8}
.zk .wlist{max-height:46vh;overflow-y:auto;border:3px solid #3a2f45;padding:2px 6px;margin-top:6px}
.zk .sbox b{font-size:16px}
/* ===== v2.1 ぽこコレクション（平成のプロフィール帳・シール帳風）。この画面の中だけ ===== */
#kcol.ov{padding:calc(8px + 0px) 8px 8px;overflow:hidden}
#kcol.on{display:flex;align-items:stretch;justify-content:center}
.pcn{--ink:#4B345A;--pink:#F8C5D9;--mint:#C6E5CE;--soda:#C8DDF5;--paper:#FFF7E9;--yel:#FFE08A;--lpink:#E9CAD8;--tc:var(--pink);--tca:rgba(248,197,217,.6);
  position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;color:var(--ink);
  border:4px solid var(--ink);border-radius:18px;box-shadow:4px 5px 0 var(--ink);overflow:hidden;
  background-color:#fff;background-image:linear-gradient(90deg,var(--tca) 50%,transparent 50%),linear-gradient(var(--tca) 50%,transparent 50%);background-size:14px 14px}
.pcn.pc-zukan{--tc:var(--mint);--tca:rgba(198,229,206,.65)}.pcn.pc-kotoba{--tc:var(--soda);--tca:rgba(200,221,245,.65)}
.pchead{position:relative;z-index:2;flex:none;padding:6px 8px 6px 22px;background:linear-gradient(#fff 0,#fff 70%,transparent);border-bottom:3px dashed var(--lpink)}
.pcrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px}
.pcrb{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:20px;font-weight:900;line-height:1;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.pcrb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.pcrb:disabled{opacity:.4}
#pctitle{font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:#fff;border:3px solid var(--ink);border-radius:20px;padding:5px 6px;box-shadow:inset 0 -3px 0 var(--tc)}
#pctabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pctab{min-height:48px;border:3px solid var(--ink);border-radius:14px;font-size:16px;color:var(--ink);box-shadow:0 3px 0 var(--ink);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:linear-gradient(#fff8 0,#fff8 35%,transparent 36%),var(--c)}
.pctab img{width:20px;height:20px}
.pctab[data-pt=album]{--c:#F8C5D9}.pctab[data-pt=zukan]{--c:#C6E5CE}.pctab[data-pt=kotoba]{--c:#C8DDF5}
.pctab.on{box-shadow:0 0 0 3px #FFE08A,0 3px 0 3px var(--ink);transform:translateY(-1px)}
.pcrings{position:absolute;left:-6px;top:14px;bottom:14px;width:26px;z-index:3;display:flex;flex-direction:column;justify-content:space-around;pointer-events:none}
.pcrings i{position:relative;display:block;width:26px;height:12px;border:3px solid var(--ink);border-radius:8px;background:linear-gradient(#fff 0,#fff 40%,#c9c0d6)}
.pcrings i:after{content:'';position:absolute;right:-1px;top:1px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
#pcbody{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:6px 6px 6px 18px;padding:8px 10px 14px;
  background:var(--paper);border:3px solid var(--ink);border-radius:12px;background-image:repeating-linear-gradient(transparent 0 27px,#f3dfe6 27px 28px)}
#pcfoot{flex:none;position:relative;z-index:2;padding:0 8px 8px 20px}
.pcn img.pcd{width:18px;height:18px;vertical-align:-3px;image-rendering:pixelated}
.pcsec{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;padding:4px 10px;border-radius:16px;border:3px solid var(--ink);background:linear-gradient(#fff,#fff 60%,var(--tc))}
.pcsec span{font-size:16px}.pcsec.keep{background:linear-gradient(#fff,#fff 60%,#F8C5D9)}.pcsec.mem{background:linear-gradient(#fff,#fff 60%,#C8DDF5);border-style:dashed}
.pcsec:first-child,.pcnote+.pcsec{margin-top:2px}
.pccard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;margin:6px 0;color:var(--ink);box-shadow:0 3px 0 var(--lpink),0 3px 0 1px var(--ink);min-height:64px}
.pccard:active:not(.ro){transform:translateY(2px)}.pccard.ro{border-style:dashed;box-shadow:none;background:#fffdf8}
.pcph{flex:none;width:56px;height:56px;border-radius:10px;background:radial-gradient(#fff 40%,var(--tc));display:flex;align-items:center;justify-content:center;border:2px solid var(--lpink)}
.pcph img{width:48px;height:48px;image-rendering:pixelated}

// ctx に (ox,oy) から描く。expr: normal/happy/sleep/sad/eat
// v1.8 デザイン調整：ほっぺ2ピクセル・鼻を少し濃く・赤ちゃんと子どもの目に光。face.plus でキャラごとのくせを強調
function drawSprite(g,s,ox,oy,expr='normal',blush=true,look=0){   // v2.4：expr 'blink'＝待機中のまばたき（1行の閉じた目）、look＝待機中に目だけ左右へ1ドット（ふつうの顔のときだけ）
  s.rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const c=r[x];if(c!=='.'){g.fillStyle=s.pal[c];g.fillRect(ox+x,oy+y,1,1)}}});
  const f=s.face; if(!f) return;
  const P=(x,y,c)=>{g.fillStyle=c;g.fillRect(ox+x,oy+y,1,1)};
  const E='#2a2238', W='#ffffff', mid=s.w/2, q=f.quirk||'', plus=f.plus||'';
  if(blush) f.blush.forEach(([x,y])=>{const a=f.ew===2?x:(x<mid?x-1:x); P(a,y,'#ff8fa6');P(a+1,y,'#ff8fa6')});
  // 目：ふだんは、たれたじと目
  const lk=expr==='normal'?(look|0):0;
  f.eyes.forEach(([x0,y])=>{
    const left=x0<mid, w=f.ew, x=x0+lk;
    if(expr==='blink'){ for(let i=-1;i<=w;i++)P(x+i,y+1,E) }   // 閉じた目（ねむい顔の目尻の下がりは付けない）
    else if(expr==='happy'){ if(w===2){P(x-1,y+1,E);P(x,y,E);P(x+1,y,E);P(x+2,y+1,E)} else {P(x-1,y+1,E);P(x,y,E);P(x+1,y+1,E)} }
    else if(expr==='sleep'){ for(let i=-1;i<=w;i++)P(x+i,y+1,E); if(w===2)P(left?x-1:x+2,y+2,E) }
    else if(expr==='sad'){ P(x,y+1,E); if(w===2){P(x+1,y+1,E);P(left?x+1:x,y-1,E);P(left?x+2:x-1,y-2,E)} }
    else { // じと目
      if(w===2){ for(let i=-1;i<=2;i++)P(x+i,y,E); P(left?x-1:x+2,y+1,E); P(x,y+1,E);P(x+1,y+1,E); P(left?x+1:x,y+1,W) }
      else { P(x-1,y,E);P(x,y,E);P(x+1,y,E);P(x,y+1,E); P(left?x-1:x+1,y+1,E); P(left?x+1:x-1,y+1,W) }
    }
  });
  if(q.includes('kuma')) f.eyes.forEach(([x,y])=>{P(x,y+2,'#8f72bf');P(x+1,y+2,'#8f72bf');if(plus==='kuma')P(x<mid?x-1:x+2,y+2,'#b9a2dc')});
  if(q.includes('matsuge')&&expr!=='sleep') f.eyes.forEach(([x0,y0])=>{const l=x0<mid, x=x0+lk, y=y0+(expr==='blink'?1:0);P(l?x-2:x+3,y-1,E);P(l?x-1:x+2,y-1,E);P(x,y-1,E);if(plus==='lash')P(l?x-3:x+4,y-2,E)});
  if(f.nose){const [nx,ny]=f.nose;P(nx,ny,'#e0606e');if(f.ew===2||s.w%2===0)P(nx+1,ny,'#e0606e')}
  // 口
  const [mx,my]=f.mouth, two=f.ew===2||s.w%2===0;
  if(q==='lips'){
    const L='#ff6f8f', Lh='#ffb3c4';
    if(expr==='eat'){g.fillStyle=L;g.fillRect(ox+mx-1,oy+my-1,4,4);g.fillStyle='#8a2040';g.fillRect(ox+mx,oy+my,2,2)}
    else if(expr==='sleep'){g.fillStyle=L;g.fillRect(ox+mx-1,oy+my,4,2);P(mx+3,my+2,'#bfe8ff')}
    else if(plus==='lips'){ // ぶあついたらこ唇
      g.fillStyle=L;g.fillRect(ox+mx-1,oy+my,4,1);g.fillRect(ox+mx-2,oy+my+1,6,1);g.fillRect(ox+mx-1,oy+my+2,4,1);
      P(mx-1,my,Lh);P(mx,my+1,E);P(mx+1,my+1,E);P(mx-2,my+1,E);P(mx+3,my+1,E);
      if(expr==='happy'){P(mx-3,my,L);P(mx+4,my,L)}
    }
    else {g.fillStyle=L;g.fillRect(ox+mx-1,oy+my,4,2);P(mx-1,my,E);P(mx+2,my,E);g.fillStyle=E;g.fillRect(ox+mx,oy+my+1,2,1);P(mx,my,Lh); if(expr==='happy'){P(mx-2,my-1,L);P(mx+3,my-1,L)}}
  } else if(expr==='eat'){g.fillStyle='#c0505a';g.fillRect(ox+mx,oy+my,2,2)}
  else if(expr==='happy'){P(mx-1,my,E);P(mx,my+1,E);P(mx+1,my+1,E);P(mx+2,my,E);P(mx+3,my-1,E)}
  else if(expr==='sad'){P(mx-1,my+1,E);P(mx,my,E);P(mx+1,my,E);P(mx+2,my+1,E)}
  else if(expr==='sleep'){P(mx,my,E);P(mx+1,my,E);P(mx+1,my+1,'#bfe8ff');P(mx+1,my+2,'#bfe8ff')}
  else { P(mx-1,my,E); if(two)P(mx,my,E); P(mx+(two?1:0),my,E); P(mx+(two?2:1),my-1,E) } // への字ぎみの口
  if(q==='deppa'&&expr!=='sleep'&&expr!=='eat'){
    P(mx,my+1,W);P(mx+1,my+1,W);P(mx-1,my+1,E);P(mx+2,my+1,E);
    if(plus==='deppa'){P(mx,my+2,'#f3ede4');P(mx+1,my+2,'#e8e2d8');P(mx,my+3,E);P(mx+1,my+3,E)} // 出っ歯（中間案）
    else {P(mx,my+2,E);P(mx+1,my+2,E)}
  }
  if(q.includes('hige')){const c='#5a3a32';[-2,-1,2,3].forEach(d=>P(mx+d,my-1,c));P(mx-3,my,c);P(mx+4,my,c)}
  if(q==='hair'){P(Math.floor(mid),-1,E);P(Math.floor(mid)+1,-2,E);P(Math.floor(mid),-3,E)}
  if(q==='hanamizu'&&expr!=='happy'){P(f.nose[0],f.nose[1]+1,'#7ccaf5');P(f.nose[0],f.nose[1]+2,'#7ccaf5')}
}

    sanpo:{bpm:88,wave:'triangle',v:.06,   // メロディーは1オクターブ上（スマホのスピーカーで小さく聞こえないように。伴奏は同じ）
      mel:[16,_,17,19, _,_,16,_, 14,_,16,_, 12,_,_,_, 17,_,19,21, _,_,19,_, 17,16,14,16, 19,_,_,_],
      bass:[-12,_,-8,_, -5,_,-8,_, -15,_,-10,_, -7,_,-10,_, -10,_,-7,_, -3,_,-7,_, -5,_,-8,_, -12,_,-5,_]},
    yama:{bpm:120,wave:'square',v:.045,
      mel:[0,_,0,4, 7,_,7,_, 5,4,2,_, 7,_,_,_, 0,_,0,4, 7,_,12,_, 11,9,7,5, 4,_,_,_],
      bass:[-12,_,-5,_, -12,_,-5,_, -14,_,-7,_, -17,_,-10,_, -12,_,-5,_, -12,_,-5,_, -10,_,-17,_, -12,_,_,_]},
  };
  function bgm(name){
    if(name===cur) return; cur=name; clearInterval(timer); timer=null; step=0;
    if(!name||!SONGS[name]) return;
    const s=SONGS[name], dur=60/s.bpm/2;
    timer=setInterval(()=>{
      if(!on||!ac||ac.state!=='running') return;
      const m=s.mel[step%s.mel.length], b=s.bass[step%s.bass.length];
      if(m!==null) tone(hz(m),dur*0.9,s.wave,s.v);
      if(b!==null) tone(hz(b),dur*0.8,'triangle',s.v*1.3);
      step++;
    },dur*1000);
  }
  // ---- 鳴き声（姿ごとにちがう） ----
  function cry(k){
    if(k==='baby'){ tone(1200,.08,'square',.1,0,300); tone(1300,.08,'square',.1,.11,300); }
    else if(k==='sbaby'||k==='schild'){ tone(k==='sbaby'?1400:980,.1,'sine',.12,0,-200); tone(k==='sbaby'?1760:1240,.14,'sine',.1,.12,120); }   // v2.4：ぴぃん（ひみつっこ）
    else if(k==='child'){ tone(820,.09,'square',.1,0,80); tone(600,.12,'square',.1,.11,-60); }       // ぽこっ
    else if(k==='umi'){ [0,.07,.14].forEach((t,i)=>tone(420+i*120,.06,'sine',.16,t,350)); }          // ぷくぷく
    else if(k==='mori'){ tone(260,.18,'triangle',.2,0,-70); tone(200,.16,'triangle',.18,.17,-40); }  // もふぅ
    else if(k==='hana'){ tone(880,.16,'sine',.15,0,520); }                                            // ぴゅい
    else if(k==='okashi'){ tone(700,.07,'square',.09,0,0); tone(1050,.12,'square',.09,.08,120); }      // ぷりん
  }
  const sfx={
    pick(){ tone(988,.06,'square',.08); tone(1319,.12,'square',.08,.06); },
    ding(){ [0,4,7,12].forEach((n,i)=>tone(hz(n+12),.12,'triangle',.12,i*.07)); },
    eat(){ [0,.12,.24].forEach(t=>tone(180,.06,'square',.08,t,-60)); },
    bite(){ tone(1500,.08,'square',.1); tone(1500,.08,'square',.1,.12); },
    splash(){ tone(300,.25,'sawtooth',.06,0,600); },
    miss(){ tone(400,.2,'triangle',.1,0,-200); },
    fanfare(){ [0,4,7,12,7,12].forEach((n,i)=>tone(hz(n+12),.14,'square',.08,i*.1)); },
    pop(){ tone(600,.05,'sine',.12,0,400); },
    btn(){ tone(1100,.03,'square',.04); },
    peta(){ tone(520,.05,'square',.1,0,-220); [0,4,7].forEach((n,i)=>tone(hz(n+19),.1,'triangle',.1,.09+i*.06)); },   // v2.2：シールを貼る音（音OFFのときは tone が鳴らさない）
    coin(){ tone(hz(24),.06,'square',.07); tone(hz(31),.12,'square',.07,.06); },
  };
  // 最初のタップで音を有効にする（ブラウザの決まり）
  // スマホは「指を離した時」「クリック」でないと音の許可が出ないので、そこで鳴らせる状態にする
  let unlocked=false;
  // 無音を1回鳴らして、音の出口を開ける（iPhone の決まり）
  function blip(a){ try{ const b=a.createBuffer(1,1,22050), src=a.createBufferSource(); src.buffer=b; src.connect(a.destination); src.start(0); }catch(e){} }
  const unlock=()=>{
    if(unlocked&&ac&&ac.state==='running') return;
    if(!on&&!ac) return;                       // 音OFFのときは部品を作らない（ONにしたタップで作る）
    let a=ctx(true); if(!a) return;
    // タップの外で作られた／何度試しても動かない部品は、このタップの中で作り直す
    if(a.state!=='running'&&(!gestureMade||tries>=2)){ a=make(); gestureMade=true; tries=0; if(!a) return; }
    tries++;
    blip(a); tryResume();
    if(a.state==='running') unlocked=true;
    else{ try{ const r=a.resume&&a.resume(); if(r&&r.then) r.then(()=>{ if(a.state==='running'){ unlocked=true; tries=0; } }).catch(()=>{}); }catch(e){} }
  };
  // 「指を離した時」「クリック」「キー」だけで試す（pointerup は iPhone で許可にならないので使わない）。他の処理に止められないよう先に受け取る
  ['touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,unlock,{passive:true,capture:true}));
  // 画面に戻ったとき：音がONで、すでに音の部品があるときだけ再開を試す（iPhoneは断ることがある→次のタップで再開）
  const wake=()=>{ if(!on||!ac||document.visibilityState==='hidden') return; if(ac.state!=='running'&&ac.state!=='closed'){ unlocked=false; tryResume(); } };
  document.addEventListener('visibilitychange',wake); window.addEventListener('pageshow',wake); window.addEventListener('focus',wake);
  return { bgm, cry, sfx,
    get on(){return on},
    toggle(){ on=!on; try{localStorage.setItem('poko_snd',on?'1':'0')}catch(e){} if(on){ unlocked=false; unlock(); } return on; } };
})();

  const SF_KICK={pet:.25, walk:.35, odd:.10, mori:.47, night:.35, umi:.42, feed:.25, boot:.20, yama:.36, cook:.26};   // シミュレーションで、それぞれ上位2〜3割くらいの人が届く数（docs/v24_secret.md）
  function sfKicks(d){
    const L=isO(d.log)?d.log:{}, k=(isO(d.sev)&&isO(d.sev.k))?d.sev.k:{}, n=a=>L['n_'+a]||0, K=SF_KICK, out=[];
    const tot=PR_ACTS.reduce((s,a)=>s+n(a),0), outn=n('go')+n('walk')+n('fish'), sh=(x,y)=>y>0?x/y:0;
    const umi=L.n_go_umi||0, mori=L.n_go_mori||0, yama=L.n_go_yama||0, odd=L.n_odd||0, boot=k.boot||0;
    if(sh(n('pet'),tot)>=K.pet||(n('walk')>=3&&sh(n('walk'),outn)>=K.walk))out.push('kage');                                   // なでることが多い／お散歩が多い
    if((odd>=2&&sh(odd,n('cook'))>=K.odd)||(mori>=3&&sh(mori,n('go'))>=K.mori))out.push('medama');                               // ふしぎな料理をよく作る／森によく行く
    if(sh(k.night||0,tot)>=K.night||(umi>=3&&sh(umi,n('go'))>=K.umi)||sh(n('feed'),tot)>=K.feed)out.push('tsuki');                // 夜のお世話が多い／海によく行く／ごはんが多い
    if((boot>=2&&sh(boot,L.n_fishok||0)>=K.boot)||(yama>=3&&sh(yama,n('go'))>=K.yama)||sh(n('cook'),tot)>=K.cook)out.push('tsumi'); // 長ぐつがよく釣れる／山によく行く／料理が多い
    return out;
  }
  function sfLife(d){
    const L=isO(d.log)?d.log:{}, P=a=>(L['p_'+a]||0)/2+Math.min(3,Math.max(0,(L['d_'+a]||0)-1));
    const home=P('feed')+P('cook')+P('pet'), out=SF_OUT*(P('go')+P('walk')+P('fish'));
    const t=isO(d.tags)?d.tags:{}, sweet=(t.fruit||0)+(t.sweet||0), wild=(t.fish||0)+(t.mush||0);
    const h=crc32(`${d.id}:sflife`);
    const isOut=out>home||(out===home&&parseInt(h.slice(0,2),16)%2===1);
    const isWild=wild>sweet||(wild===sweet&&parseInt(h.slice(2,4),16)%2===1);
    return (isOut?'out':'home')+'_'+(isWild?'wild':'sweet');
  }
  // 判定の本体（保存データ d と性格 p から。何度呼んでも同じ答え）
  function sfCalc(d,p){
    const v=sevFix(d)||{a:[null,null,null]}, sc={}, ev={}; SF_IDS.forEach(f=>{sc[f]=0;ev[f]=0});
    const life=sfLife(d); SF_LIFE[life].forEach(f=>sc[f]+=SF_W.life*10);
    v.a.forEach((c,i)=>{if(c===0||c===1)SEV[i].pt[c].forEach(f=>{sc[f]+=SF_W.ev*10;ev[f]++})});
    if(SF_PERS[p])sc[SF_PERS[p]]+=SF_W.pers*10;
    const kk=sfKicks(d); kk.forEach(f=>sc[f]+=SF_W.kick*10);
    Object.keys(sc).forEach(f=>sc[f]=Math.round(sc[f]));   // 10倍の整数で比べる（小数の誤差を出さない）
    const ord=f=>parseInt(crc32(`${d.id}:${f}`),16);
    const best=SF_IDS.slice().sort((a,b)=>(sc[b]-sc[a])||(ev[b]-ev[a])||(SF_LIFE[life].includes(b)-SF_LIFE[life].includes(a))||((SF_PERS[p]===b)-(SF_PERS[p]===a))||(ord(a)-ord(b)))[0];
    return {f:best,life,kicks:kk,sc};
  }
  // 条件がそろったら一度だけ進化先を決めて保存（STEP4 で絵ができるまでは姿は変えない）
  function secretCheck(){
    if(!S||S.kind!=='secret'||S.stage!=='child'||!secretReady(S))return false;
    if(!isO(S.sfate)){const p=prDecide(S,PR_MIN_NEW)||prFallback(S), r=sfCalc(S,p); S.sfate={v:SF_RULE,f:r.f,p,life:r.life,day:dayNo()}; save();}
    if(SECRET_FORMS.length&&SECRET_FORMS.includes(S.sfate.f))secretEvolve();
    return true;
  }

    for(let Y=Math.floor(cy-ry-1);Y<=cy+ry+1;Y++)for(let X=Math.floor(cx-rx-1);X<=cx+rx+1;X++){

  }

  const BG_IMG={};
  function bgImg(p,k){const key=p+':'+k; let im=BG_IMG[key]; if(!im){im=new Image(); im.onerror=()=>{im._bad=1}; im.src=BG_ART[p][k]; BG_IMG[key]=im} return im.complete&&im.naturalWidth&&!im._bad?im:null}
  function bgReady(p){ if(!BG_NEW||!BG_ART[p])return false; let ok=true; ['sky','land','c1','c2'].forEach(k=>{if(!bgImg(p,k))ok=false}); return ok }
  const bgDraw=(im,x,y)=>g.drawImage(im,x,y,im.naturalWidth/RES,im.naturalHeight/RES);   // 絵の1画素＝画面の1画素

  // ===== v2.3 きずなのしるし（docs/v23_bond.md）=====
  // 初期4種類の大人が「なかよし100」になったことを、進化図鑑の保存場所の achv に記録する（日時の数）。

  //   bond100_<姿>：達成した日時 / bondseen_<姿>：お知らせを出した日時 / bond4：4種類そろった日時 / bondscan：退避データを一度見た日時

  // ===== v2.4 ひみつの種・ひみつのかけら（STEP1：受け取り・保存・交換・引き継ぎ。docs/v24_secret.md）=====
  // セーブ本体 S.secret（引っ越しコード・バックアップに入る。古い版は知らない項目として残す）

  const SEC_MAX=99, KAKERA_NEED=3, KAKERA_P=0.15, SECKEEP=KEY+'_secretkeep', SEC_OK=new WeakSet();

  function kakeraAdd(n){ const c=secFix(S); c.kakera+=n; while(c.kakera>=KAKERA_NEED&&c.seeds<SEC_MAX){c.kakera-=KAKERA_NEED;c.seeds++;c.made++} c.kakera=Math.min(c.kakera,KAKERA_NEED-1); }

  // 形式2の検査（引き継ぎコード・バックアップ用）。おかしければ例外。知らない項目は残す

  // 重要な操作：新しい状態を保存できたときだけ切り替える。backupKey があれば先に今のデータを退避（退避できなければ中止）

  // 形式1 → 形式2 の移行（読み込み時）。成功したら新しいデータ、失敗したら理由を返す。元のデータは必ず残す
  function migrate(raw,d){
    const BK=KEY+'_before_v2';
    try{ if(localStorage.getItem(BK)===null)localStorage.setItem(BK,raw); if(localStorage.getItem(BK)===null)throw 0 }catch(e){return {ok:false,why:'backup'}}
    let n; try{ n=ensureIntegrity(upgrade(d)); JSON.parse(JSON.stringify(n)) }catch(e){return {ok:false,why:'convert'}}
    const txt=JSON.stringify(n);
    try{localStorage.setItem(KEY,txt)}catch(e){return {ok:false,why:'write'}}
    let back=null; try{back=localStorage.getItem(KEY)}catch(e){}
    if(back!==txt){ try{localStorage.setItem(KEY,raw); if(localStorage.getItem(KEY)!==raw)throw 0}catch(e){return {ok:false,why:'restorefail'}} return {ok:false,why:'verify'} }
    KNOWN=txt; saveLatest(txt);
    return {ok:true,data:n};
  }
  // 取り込んだデータ（コード・ファイル・退避）を形式2にそろえる
  function toCurrent(obj,isCode){
    const ver=typeof obj.ver==='number'?obj.ver:1;
    if(ver>SAVE_FORMAT)throw new Error('新しいバージョンのデータです。ゲームを最新にしてから試してね');
    if(ver<=1){const c=checkSave(obj.data); return ensureIntegrity(upgrade(c));}
    return ensureIntegrity(checkSave2(obj.data));
  }
  // 古いセーブを読むとき用：足りない項目を補うだけ（拒否はしない）
  const HELD_MAX=1000;
  // 保管の一覧がいっぱいで、さらに保管が必要なとき（黙って消さずに止める）
  function HELD_FULL_CHECK(d){ if(!isO(d)||!d.explore)return false; const E=d.explore;
    if(isO(E)&&typeof E.p==='string'&&typeof E.end==='number')return false;
    const n=Array.isArray(d.exploreHeld)?d.exploreHeld.length:(d.exploreHeld!==undefined?1:0); return n>=HELD_MAX }
  function repairSave(d){
    if(!d||typeof d!=='object')return null;
    for(const k of ['inv','dishes','decor','tags'])if(!d[k]||typeof d[k]!=='object'||Array.isArray(d[k]))d[k]={};
    if(!Array.isArray(d.recipes))d.recipes=[];
    if(typeof d.genki!=='number'||!isFinite(d.genki))d.genki=3;
    if(typeof d.aff!=='number'||!isFinite(d.aff))d.aff=0;
    if(typeof d.last!=='number'||!isFinite(d.last))d.last=Date.now();
    if(typeof d.skew!=='number'||!isFinite(d.skew))d.skew=0;
    if(typeof d.name!=='string'||!d.name)d.name='ぽこ';
    // v1.9：知らない姿を「花の子」に書き換えない（新しい版のデータを壊さないため）。姿がないときだけ補う
    if(d.stage==='adult'&&(typeof d.form!=='string'||!d.form))d.form='hana';
    if(!['seed','baby','child','adult'].includes(d.stage))d.stage='baby';
    if(d.exploreHeld!==undefined&&!Array.isArray(d.exploreHeld))d.exploreHeld=[{at:null,ver:SAVE_FORMAT,data:d.exploreHeld}];   // 以前の1件だけの形 → 一覧に
    if(d.explore&&!(isO(d.explore)&&typeof d.explore.p==='string'&&typeof d.explore.end==='number')){   // 使えない形は消さずに一覧の最後に追加
      if(!Array.isArray(d.exploreHeld))d.exploreHeld=[];
      d.exploreHeld.push({at:Date.now(),ver:SAVE_FORMAT,data:d.explore}); d.explore=null}
    if(d.explore){if(!Array.isArray(d.explore.ev))d.explore.ev=[];if(!Array.isArray(d.explore.bonus))d.explore.bonus=[]}
    return d;
  }
  // 引き継ぎコード： POKO-<形式>-<データ>-<確認用の数字>
  function makeCode(){
    const json=JSON.stringify({app:'pokohouse',ver:SAVE_FORMAT,at:Date.now(),data:S,...(DEXS?{dex:DEXS}:{})});
    return `POKO-${SAVE_FORMAT}-${b64e(json)}-${crc32(json)}`;
  }
  function readCode(code){
    code=String(code||'').replace(/\s+/g,'');
    if(!code)throw new Error('コードが入っていません');
    if(code.length>MAX_IMPORT)throw new Error('コードが長すぎます');
    const m=code.match(/^POKO-(\d+)-([A-Za-z0-9_-]+)-([0-9a-f]{8})$/);
    if(!m)throw new Error('ぽこのおひっこしコードではないみたい');
    if(+m[1]>SAVE_FORMAT)throw new Error('新しいバージョンのコードです。ゲームを最新にしてから試してね');
    let json; try{json=b64d(m[2])}catch(e){throw new Error('コードがこわれています（文字が欠けているかも）')}
    if(crc32(json)!==m[3])throw new Error('コードがこわれています（文字が欠けているかも）');
    let obj; try{obj=JSON.parse(json)}catch(e){throw new Error('コードがこわれています')}
    if(!obj||obj.app!=='pokohouse')throw new Error('ぽこのおひっこしコードではないみたい');
    IMPORT_WORDS=null; IMPORT_DEX=isO(obj.dex)?obj.dex:null;   // 発見記録は、復元できたときに今の記録と合わせる（減らさない）
    return toCurrent({ver:+m[1],data:obj.data},true);
  }
  let IMPORT_DEX=null, IMPORT_WORDS=null;
  function readBackup(text){
    if(text.length>MAX_IMPORT)throw new Error('ファイルが大きすぎます');
    let obj; try{obj=JSON.parse(text)}catch(e){throw new Error('バックアップファイルではないみたい')}
    if(!obj||obj.app!=='pokohouse'||typeof obj.data!=='object')throw new Error('ぽこのバックアップファイルではないみたい');
    if(+obj.ver>SAVE_FORMAT)throw new Error('新しいバージョンのファイルです。ゲームを最新にしてから試してね');
    if(obj.crc!==crc32(JSON.stringify(obj.data)))throw new Error('ファイルがこわれています');
    IMPORT_DEX=isO(obj.dex)&&obj.dexcrc===crc32(JSON.stringify(obj.dex))?obj.dex:null;
    IMPORT_WORDS=isO(obj.words)&&obj.wordscrc===crc32(JSON.stringify(obj.words))?obj.words:null;
    return toCurrent({ver:+obj.ver,data:obj.data},false);
  }
  // 復元：保存できたのを確かめてから画面に反映。失敗したら元に戻す
  function applySave(clean,backupKey){
    const r=commit(clean,backupKey||(KEY+'_before_restore_'+Date.now()));
    if(!r.ok)return false;
    try{DEXS=dexMerge(DEXS||dexNew(),IMPORT_DEX||dexNew());IMPORT_DEX=null;dexFromSave(S,true);dexDirty=true;dexFlush()}catch(e){}
    try{if(IMPORT_WORDS){WORDS=wordsMerge(wordsNow(),IMPORT_WORDS);wordsDirty=true;wordsFlush()}IMPORT_WORDS=null}catch(e){}   // v2.1：ことば帳は合わせる（減らさない）
    try{bondScan()}catch(e){}   // v2.3：復元したデータの今の子・アルバムからも、きずなのしるしを記録
    EX=null; x=34; busy=null; return true;
  }

  // 保存の容量（AL7）：この端末の保存場所に入っている量（UTF-16 換算）。Safari は1サイト約5MBなので、その70%・85%で知らせる
  const STORE_CAP=5*1024*1024;
  function storeUse(){let n=0,list=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),v=localStorage.getItem(k)||'';const b=(k.length+v.length)*2;n+=b;list.push({k,b,v})}}catch(e){}return {n,list}}
  const kb=b=>b<1024*1024?Math.ceil(b/1024)+'KB':(b/1024/1024).toFixed(1)+'MB';
  // 整理してよいもの：v1.8 選び直しの古い予備・中身がまったく同じ重複の退避（新しい方を1つ残す）・読めなかった発見記録の写し。大事な退避は対象にしない
  function tidyList(){
    const {list}=storeUse(), out=[], seen=new Map();
    const bk=list.filter(x=>x.k.startsWith(KEY+'_')&&x.k!==LATEST&&x.k!==DEXK).sort((a,b)=>(+(b.k.match(/_(\d{10,})$/)||[])[1]||0)-(+(a.k.match(/_(\d{10,})$/)||[])[1]||0));
    for(const x of bk){ if(x.k.startsWith(KEY+'_latest2_prev_')||x.k.startsWith(DEXK+'_broken_')){out.push(x);continue}
      if(seen.has(x.v))out.push(Object.assign({dup:seen.get(x.v)},x)); else seen.set(x.v,x.k) }
    return out;
  }
  function storageUI(){
    const {n}=storeUse(), T=tidyList(), pc=Math.round(n/STORE_CAP*100);
    modal(`<h2>💾 保存の容量</h2><p>この端末で使っている量：${kb(n)}（目安 ${kb(STORE_CAP)} の ${pc}%）</p>
      ${pc>=85?'<p class="tleft"><b>⚠ 保存がいっぱいに近づいています。先にバックアップファイルを保存してね。</b></p>':pc>=70?'<p class="tleft">保存が多くなってきました。バックアップファイルを保存しておくと安心です。</p>':''}
      <button class="pbtn" id="stbk">📄 バックアップファイルを保存する</button>
      <p class="tleft"><small>整理してよいもの（同じ中身の重複・古い予備）だけを選んで消せます。大事な退避（更新・復元・最初から・次の子などの前のデータ）はここでは消しません。</small></p>
      ${T.length?T.map((x,i)=>`<label class="place"><input type="checkbox" data-td="${i}"><span>${esc(x.k.replace(KEY,''))}<small>${kb(x.b)}${x.dup?'・同じ中身が残ります':''}</small></span></label>`).join('')+'<button class="pbtn red" id="sttidy">選んだものを消す</button>':'<p>整理できるものはありません</p>'}
      <button class="pbtn gray" onclick="K.close()">とじる</button>`);
    $('stbk').onclick=()=>{try{downloadBackup(S);ktoast(SAVED_NOTE)}catch(e){ktoast('保存を開始できませんでした')}};
    if($('sttidy'))$('sttidy').onclick=()=>{const pick=[...document.querySelectorAll('[data-td]')].filter(c=>c.checked).map(c=>T[+c.dataset.td]);
      if(!pick.length){ktoast('消すものを選んでね');return}
      modal(`<h2>本当に消しますか？</h2><p class="tleft">${pick.map(x=>esc(x.k.replace(KEY,''))).join('<br>')}</p><button class="pbtn red" id="tdok">消す</button><button class="pbtn gray" id="tdno">やめる</button>`);
      $('tdno').onclick=()=>storageUI();
      $('tdok').onclick=()=>{let c=0;for(const x of pick){try{if(localStorage.getItem(x.k)===x.v){localStorage.removeItem(x.k);c++}}catch(e){}}storageUI();ktoast(`${c}こ消しました`)}};
  }
  function storeWarn(){ if(LOCK||!S)return; const pc=storeUse().n/STORE_CAP*100;
    if(pc>=85)setTimeout(()=>{if(!$('kmodal').classList.contains('on'))storageUI()},3000); else if(pc>=70)setTimeout(()=>ktoast('保存が多くなってきました。せってい →「保存の容量」でバックアップを保存してね'),3000) }
  // ---- データの復旧（この端末に残っている退避データ） ----
  function snapshots(){
    const L=[]; const lab=k=>k===KEY+'_before_v2'?'更新（v1.9）の前のデータ':k.startsWith(KEY+'_before_restore')?'おひっこし（復元）の前のデータ':k.startsWith(KEY+'_before_reset')?'「最初から」の前のデータ':k.startsWith(KEY+'_before_recover')?'復旧する前のデータ':k.startsWith(KEY+'_before_next_')?'次の子を育てる前のデータ':k.startsWith(KEY+'_before_album_remove_')?'アルバムから外す前のデータ':k.startsWith(KEY+'_before_restart_')?'今の子をやり直す前のデータ':k.startsWith(KEY+'_broken')?'読めなかったデータ':k.startsWith(KEY+'_v18over')?'古い画面（v1.8など）で上書きされたデータ':k===LATEST?'v1.9で最後に正しく保存したデータ（予備）':k.startsWith(KEY+'_latest2_prev')?'選び直す前のv1.9のデータ':null;
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith(KEY+'_'))continue;const l=lab(k);if(!l)continue;
      const raw=localStorage.getItem(k);if(k===LATEST&&raw===readKey())continue;let d=null;try{d=JSON.parse(raw)}catch(e){}
      const t=+(k.match(/_(\d{10,})$/)||[])[1]||0; L.push({k,l,raw,d:isO(d)?d:null,t})}}catch(e){}
    return L.sort((a,b)=>(b.t-a.t)||a.k.localeCompare(b.k));
  }

// 決めた大きさより大きくはしない。パソコンなど（devicePixelRatio が2より小さい）では何もしない（今までどおり）
(function(){
  const dpr=window.devicePixelRatio||1; if(dpr<2)return;
  const SEL='img.pcd,img.bi,img.ii,#kpfimg,.pcbi img.pix';
  const snap=img=>{ if(img.dataset.cs===img.src)return;
    const go=()=>{ const nw=img.naturalWidth,nh=img.naturalHeight; if(!nw||!nh)return; img.style.width=''; img.style.height='';
      const cs=getComputedStyle(img), w=parseFloat(cs.width), h=parseFloat(cs.height); if(!(w>0&&h>0))return;
      const k=Math.max(1,Math.floor(Math.min(w/nw,h/nh)*dpr+0.01)); img.style.width=(nw*k/dpr)+'px'; img.style.height=(nh*k/dpr)+'px'; img.dataset.cs=img.src; };
    if(img.complete&&img.naturalWidth)go(); else img.addEventListener('load',go,{once:true}); };
  const scan=r=>{ if(r.matches&&r.matches(SEL))snap(r); if(r.querySelectorAll)r.querySelectorAll(SEL).forEach(snap); };
  try{ new MutationObserver(ms=>ms.forEach(m=>{ if(m.type==='attributes'){if(m.target.matches&&m.target.matches(SEL)){delete m.target.dataset.cs;snap(m.target)}} else m.addedNodes.forEach(n=>{if(n.nodeType===1)scan(n)}) }))
    .observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src']}); scan(document.body); }catch(e){}
})();
